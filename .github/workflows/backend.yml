name: Backend CI

on:
  pull_request:
    paths:
      - "nutriguard-backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "nutriguard-backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nutriguard-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nutriguard-backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
